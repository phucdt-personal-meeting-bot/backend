services:
  db:
    image: postgres:17.4-alpine3.21
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  s3:
    image: luofuxiang/local-s3:2.4
    restart: unless-stopped
    environment:
      MODE: PERSISTENCE
      LOCAL_S3_LOGGING_LEVEL: info
    ports:
      - "8080:80"
    volumes:
      - s3_data:/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  s3_data:
